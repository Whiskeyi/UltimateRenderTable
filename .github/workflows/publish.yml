name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified tarballs to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release candidates must be verified from the main branch."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build workspace
        run: npm run build

      - name: Check bundle budgets
        run: npm run check:size

      - name: Verify packages
        run: npm run verify:packages

      - name: Verify packed consumers
        env:
          PACKED_CONSUMER_ALLOW_NETWORK: true
        run: npm run verify:tarballs

      - name: Verify React 18 packed consumer
        env:
          REACT_VERSION: 18.3.1
          PACKED_CONSUMER_ALLOW_NETWORK: true
        run: node scripts/verify-packed-consumer.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e:built

      - name: Upload verified package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-artifacts-${{ github.sha }}
          path: |
            package-artifacts/*.tgz
            package-artifacts/manifest.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified packages
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download verified package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts-${{ github.sha }}
          path: package-artifacts/

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_USE_OIDC: ${{ vars.NPM_USE_OIDC }}
        run: |
          if [[ "$NPM_USE_OIDC" == "true" ]]; then
            NODE_AUTH_TOKEN= npm run publish:packages
          else
            npm run publish:packages
          fi
