name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified tarballs to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build workspace
        run: npm run build

      - name: Check bundle budgets
        run: npm run check:size

      - name: Verify packages
        run: npm run verify:packages

      - name: Verify packed consumers
        env:
          PACKED_CONSUMER_ALLOW_NETWORK: true
        run: npm run verify:tarballs

      - name: Verify React 18 packed consumer
        env:
          REACT_VERSION: 18.3.1
          PACKED_CONSUMER_ALLOW_NETWORK: true
        run: node scripts/verify-packed-consumer.mjs

  publish:
    name: Publish verified packages
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Verify packages
        run: npm run verify:packages

      - name: Pack packages
        run: npm run pack:packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: package-artifacts/
          if-no-files-found: error

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_USE_OIDC: ${{ vars.NPM_USE_OIDC }}
        run: |
          if [[ "$NPM_USE_OIDC" == "true" ]]; then
            NODE_AUTH_TOKEN= npm run publish:packages
          else
            npm run publish:packages
          fi
