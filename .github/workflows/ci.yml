name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build packages
        run: npm run build:packages

      - name: Verify package contracts
        run: npm run verify:packages

  quality:
    name: Quality and packed consumers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build workspace
        run: npm run build

      - name: Check bundle budgets
        run: npm run check:size

      - name: Verify packed consumers
        env:
          PACKED_CONSUMER_ALLOW_NETWORK: true
        run: npm run verify:tarballs

      - name: Verify React 18 packed consumer
        env:
          REACT_VERSION: 18.3.1
          PACKED_CONSUMER_ALLOW_NETWORK: true
        run: node scripts/verify-packed-consumer.mjs

  browser:
    name: Chromium interaction tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Studio
        run: npm run build:demo

      - name: Run browser tests
        run: npm run test:e2e:built
